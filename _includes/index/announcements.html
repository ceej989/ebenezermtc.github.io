<section id="announcements" class="banner-top">
  <div class="container">
    <div class="row">
      <div class="col-md-12 text-left">
        <h1>Announcements</h1>
        <br/>
      </div>
    </div>
    {% for post in site.posts limit:10 %}
    {% if post.categories contains 'general' %}
    <div class="col-md-10">
      <div class="col-md-12 margin-btm-30">
        <h3><a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a></h3>
        <span>{{ post.date | date: "%b %-d, %Y" }} </span>
        <p>
          {{ post.content }}
        </p>
        <p class="text-right">
          <!--
          <a href="{{ post.url | prepend: site.baseurl }}" class="btn btn-dark btn-xs">
            Read More
          </a> -->
        </p>
      </div><!--blog desc-->
  </div>
  {% endif %}
  {% endfor %} 
  </div> 
</section> <!--End News Section  -->
